<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Lokale Zugänglichkeitsprüfung</title><style>body{font-family:system-ui;padding:20px;color:#102e2c;background:#f7f8f3}button{padding:15px;font:inherit}iframe{display:block;width:100%;height:850px;border:1px solid #889e7a;margin-top:20px}pre{white-space:pre-wrap;font-size:13px}label{display:block;margin:15px 0}</style></head><body><h1>Lokale Zugänglichkeitsprüfung</h1><p>Entwicklungswerkzeug. Nicht Bestandteil der veröffentlichten Website.</p><label>Prüfbreite <select id="width"><option>1440</option><option>390</option><option>320</option></select></label><button id="run">Alle Seiten prüfen</button><pre id="results" role="status">Bereit.</pre><iframe title="Zu prüfende Website" id="frame"></iframe><script>
const paths=['/','/ueber-mich/','/leistungen/digitale-barrierefreiheit/','/leistungen/ux-design/','/leistungen/webentwicklung/','/leistungen/strategie-testing/','/impulse/','/impulse/barrierefreiheit-im-alltag/','/impulse/willkommen/','/impressum/','/datenschutz/','/barrierefreiheit/','/agb/','/404/'];
document.querySelector('#run').onclick=async()=>{
 const results=document.querySelector('#results'),frame=document.querySelector('#frame');results.textContent='Prüfung läuft…';document.querySelector('#run').disabled=true;frame.style.width=document.querySelector('#width').value+'px';const all=[];
 try{for(const path of paths){await new Promise(resolve=>{frame.onload=resolve;frame.src=path});await frame.contentDocument.fonts.ready;const script=frame.contentDocument.createElement('script');script.src='/__qa-axe.js';await new Promise((resolve,reject)=>{script.onload=resolve;script.onerror=reject;frame.contentDocument.head.appendChild(script)});const audit=await frame.contentWindow.axe.run(frame.contentDocument,{runOnly:{type:'tag',values:['wcag2a','wcag2aa','wcag21a','wcag21aa','wcag22aa','best-practice']}});const item={path,violations:audit.violations.map(v=>({id:v.id,impact:v.impact,description:v.description,nodes:v.nodes.map(n=>({html:n.html,summary:n.failureSummary}))})),incomplete:audit.incomplete.map(v=>({id:v.id,nodes:v.nodes.map(n=>({html:n.html,summary:n.failureSummary}))})),overflow:frame.contentDocument.documentElement.scrollWidth>frame.contentWindow.innerWidth};all.push(item);results.textContent=JSON.stringify(all,null,2);}}catch(e){results.textContent+='\nFEHLER: '+e.message;}document.querySelector('#run').disabled=false;results.textContent='ABGESCHLOSSEN\n'+results.textContent;
};</script></body></html>
